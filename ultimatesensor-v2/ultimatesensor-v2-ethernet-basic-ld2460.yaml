# UltimateSensor V2 Ethernet Basic LD2460 Upgrade Configuration
# Use only when the standard LD2450 module has been replaced by the optional LD2460 upgrade.

substitutions:
  device_name: ultimatesensor-v2
  friendly_name: "UltimateSensor V2"
  ultimatesensor_hardware_version: "V2-Basic-LD2460"
  ultimatesensor_connection_type: "Ethernet"
  default_network: "Ethernet Basic (local)"
  tracking_suffix: "-ld2460"
  update_manifest_url: "https://smarthomeshop.github.io/ultimatesensor/ultimatesensor-v2-ethernet-basic-ld2460-manifest.json"

packages:
  base: !include base.yaml
  tracking: !include tracking-ld2460.yaml
  net: !include ethernet.yaml
  voice: !include voice-assistant.yaml
  lighting: !include led-lighting.yaml
  firmware: !include firmware-selector.yaml

dashboard_import:
  package_import_url: github://smarthomeshop/ultimatesensor/ultimatesensor-v2/ultimatesensor-v2-ethernet-basic-ld2460.yaml@main
