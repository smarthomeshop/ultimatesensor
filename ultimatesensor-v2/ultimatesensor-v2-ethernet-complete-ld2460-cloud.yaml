# UltimateSensor V2 Ethernet Complete LD2460 Cloud Configuration

substitutions:
  device_name: ultimatesensor-v2
  friendly_name: "UltimateSensor V2"
  ultimatesensor_hardware_version: "V2-Complete-LD2460"
  ultimatesensor_connection_type: "Ethernet"
  cloud_mac_sensor_id: ethernet_mac_address
  cloud_ip_sensor_id: ethernet_ip_address
  default_network: "Ethernet Complete + SmartHomeShop App (cloud)"
  tracking_suffix: "-ld2460"
  update_manifest_url: "https://smarthomeshop.github.io/ultimatesensor/ultimatesensor-v2-ethernet-complete-ld2460-cloud-manifest.json"

packages:
  base: !include base.yaml
  tracking: !include tracking-ld2460.yaml
  net: !include ethernet.yaml
  voice: !include cloud-voice.yaml
  variant: !include complete.yaml
  cloud: !include cloud.yaml
  cloud_lighting_entities: !include cloud-lighting-entities.yaml
  cloud_pm: !include cloud-pm.yaml
  firmware: !include firmware-selector.yaml

dashboard_import:
  package_import_url: github://smarthomeshop/ultimatesensor/ultimatesensor-v2/ultimatesensor-v2-ethernet-complete-ld2460-cloud.yaml@main
