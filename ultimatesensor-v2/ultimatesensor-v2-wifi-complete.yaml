# UltimateSensor V2 WiFi Complete Configuration
# ESP32-S3 firmware with the SPS30 particulate matter sensor.

substitutions:
  device_name: ultimatesensor-v2
  friendly_name: "UltimateSensor V2"
  ultimatesensor_hardware_version: "V2-Complete"
  ultimatesensor_connection_type: "WiFi"
  wifi_fast_connect: "false"

packages:
  base: !include base.yaml
  tracking: !include tracking-ld2450.yaml
  net: !include wifi.yaml
  voice: !include voice-assistant.yaml
  variant: !include complete.yaml

dashboard_import:
  package_import_url: github://smarthomeshop/ultimatesensor/ultimatesensor-v2/ultimatesensor-v2-wifi-complete.yaml@main
