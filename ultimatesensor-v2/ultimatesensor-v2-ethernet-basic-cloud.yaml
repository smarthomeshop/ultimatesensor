# UltimateSensor V2 Ethernet Basic Cloud Configuration

substitutions:
  device_name: ultimatesensor-v2
  friendly_name: "UltimateSensor V2"
  ultimatesensor_hardware_version: "V2-Basic"
  ultimatesensor_connection_type: "Ethernet"
  cloud_mac_sensor_id: ethernet_mac_address
  cloud_ip_sensor_id: ethernet_ip_address
  default_network: "Ethernet Basic + SmartHomeShop App (cloud)"
  tracking_suffix: ""
  update_manifest_url: "https://smarthomeshop.github.io/ultimatesensor/ultimatesensor-v2-ethernet-basic-cloud-manifest.json"

packages:
  base: !include base.yaml
  tracking: !include tracking-ld2450.yaml
  net: !include ethernet.yaml
  voice: !include voice-assistant.yaml
  cloud: !include cloud.yaml
  zones: !include cloud-zones.yaml
  firmware: !include firmware-selector.yaml

dashboard_import:
  package_import_url: github://smarthomeshop/ultimatesensor/ultimatesensor-v2/ultimatesensor-v2-ethernet-basic-cloud.yaml@main
