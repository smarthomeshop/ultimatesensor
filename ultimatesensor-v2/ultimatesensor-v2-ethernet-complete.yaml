# UltimateSensor V2 Ethernet Complete Configuration
# ESP32-S3 firmware with the SPS30 particulate matter sensor.

substitutions:
  device_name: ultimatesensor-v2
  friendly_name: "UltimateSensor V2"
  ultimatesensor_hardware_version: "V2-Complete"
  ultimatesensor_connection_type: "Ethernet"
  default_network: "Ethernet Complete (local)"
  tracking_suffix: ""
  update_manifest_url: "https://smarthomeshop.github.io/ultimatesensor/ultimatesensor-v2-ethernet-complete-manifest.json"

packages:
  base: !include base.yaml
  tracking: !include tracking-ld2450.yaml
  net: !include ethernet.yaml
  voice: !include voice-assistant.yaml
  lighting: !include led-lighting.yaml
  variant: !include complete.yaml
  firmware: !include firmware-selector.yaml

dashboard_import:
  package_import_url: github://smarthomeshop/ultimatesensor/ultimatesensor-v2/ultimatesensor-v2-ethernet-complete.yaml@main
