# UltimateSensor V2 WiFi Basic Cloud Configuration

substitutions:
  device_name: ultimatesensor-v2
  friendly_name: "UltimateSensor V2"
  ultimatesensor_hardware_version: "V2-Basic"
  ultimatesensor_connection_type: "WiFi"
  wifi_fast_connect: "false"
  cloud_mac_sensor_id: wifi_mac
  cloud_ip_sensor_id: wifi_ip

packages:
  base: !include base.yaml
  tracking: !include tracking-ld2450.yaml
  net: !include wifi.yaml
  voice: !include voice-assistant.yaml
  cloud: !include cloud.yaml
  zones: !include cloud-zones.yaml

dashboard_import:
  package_import_url: github://smarthomeshop/ultimatesensor/ultimatesensor-v2/ultimatesensor-v2-wifi-basic-cloud.yaml@main
