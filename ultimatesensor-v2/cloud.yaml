# UltimateSensor Cloud Integration
# Optional SmartHomeShop cloud sync over HTTP POST.

json:

substitutions:
  cloud_enabled: "true"
  cloud_api_url: "https://api.smarthomeshop.io"
  cloud_api_version: "v1"
  cloud_sync_interval: "60s"
  cloud_presence_sync_interval: "10s"
  cloud_speaker_test_url: "${cloud_api_url}/audio/ultimatesensor-speaker-test.mp3"
  http_request_verify_ssl: "true"
  cloud_mac_sensor_id: wifi_mac
  cloud_ip_sensor_id: wifi_ip

http_request:
  useragent: ultimatesensor-cloud-esphome
  verify_ssl: ${http_request_verify_ssl}
  timeout: 10s
  watchdog_timeout: 15s

esphome:
  on_boot:
    - priority: -25
      then:
        - delay: 12s
        - media_player.volume_set:
            id: media_player_01
            volume: !lambda "return id(cloud_speaker_volume) / 100.0f;"
        - lambda: |-
            if (id(cloud_is_registered) && !id(cloud_device_id).empty()
                && !id(cloud_device_token).empty()) {
              id(cloud_voice_client).set_credentials(
                id(cloud_device_id),
                id(cloud_device_token)
              );
            } else {
              id(cloud_voice_client).clear_credentials();
            }
        - script.execute: cloud_sync_voice_settings
    - priority: -100
      then:
        - delay: 10s
        - if:
            condition:
              lambda: "return !id(cloud_is_registered);"
            then:
              - script.execute: cloud_register
    - priority: -50
      then:
        - delay: 12s
        - lambda: |-
            id(cloud_led_automation_ready) = true;
            id(cloud_led_runtime_state) = -1;

time:
  - platform: sntp
    id: sntp_cloud_time
    timezone: "Europe/Amsterdam"
    servers:
      - "pool.ntp.org"
      - "time.google.com"

globals:
  - id: cloud_device_token
    type: std::string
    restore_value: true
    initial_value: '""'
  - id: cloud_device_id
    type: std::string
    restore_value: true
    initial_value: '""'
  - id: cloud_is_registered
    type: bool
    restore_value: true
    initial_value: "false"
  - id: cloud_is_registering
    type: bool
    restore_value: false
    initial_value: "false"
  - id: cloud_last_sync_success
    type: bool
    restore_value: false
    initial_value: "false"
  - id: cloud_sync_failures
    type: int
    restore_value: false
    initial_value: "0"
  - id: cloud_last_presence_signature
    type: int
    restore_value: false
    initial_value: "-1"
  - id: cloud_configuration_syncing
    type: bool
    restore_value: false
    initial_value: "false"
  - id: cloud_voice_settings_syncing
    type: bool
    restore_value: false
    initial_value: "false"
  - id: cloud_http_request_busy
    type: bool
    restore_value: false
    initial_value: "false"
  - id: cloud_configuration_boot_sync_done
    type: bool
    restore_value: false
    initial_value: "false"
  - id: cloud_led_configuration_version
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: cloud_desired_configuration_version
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: cloud_sps30_quiet_settings_present
    type: bool
    restore_value: false
    initial_value: "false"
  - id: cloud_sps30_quiet_hours_enabled
    type: bool
    restore_value: true
    initial_value: "false"
  - id: cloud_sps30_quiet_start_hour
    type: int
    restore_value: true
    initial_value: "22"
  - id: cloud_sps30_quiet_end_hour
    type: int
    restore_value: true
    initial_value: "7"
  - id: cloud_sps30_quiet_settings_revision
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: cloud_led_enabled
    type: bool
    restore_value: true
    initial_value: "false"
  - id: cloud_speaker_volume
    type: int
    restore_value: true
    initial_value: "40"
  - id: cloud_speaker_test_sequence
    type: int
    restore_value: true
    initial_value: "0"
  - id: cloud_speaker_test_pending
    type: bool
    restore_value: false
    initial_value: "false"
  - id: cloud_motion_light_enabled
    type: bool
    restore_value: true
    initial_value: "false"
  - id: cloud_motion_light_brightness
    type: int
    restore_value: true
    initial_value: "70"
  - id: cloud_night_light_enabled
    type: bool
    restore_value: true
    initial_value: "false"
  - id: cloud_night_light_brightness
    type: int
    restore_value: true
    initial_value: "10"
  - id: cloud_night_light_start_hour
    type: int
    restore_value: true
    initial_value: "22"
  - id: cloud_night_light_end_hour
    type: int
    restore_value: true
    initial_value: "7"
  - id: cloud_co2_alert_enabled
    type: bool
    restore_value: true
    initial_value: "false"
  - id: cloud_co2_warning_ppm
    type: int
    restore_value: true
    initial_value: "1000"
  - id: cloud_co2_critical_ppm
    type: int
    restore_value: true
    initial_value: "1500"
  - id: cloud_co2_alert_cooldown_minutes
    type: int
    restore_value: true
    initial_value: "5"
  - id: cloud_configuration_ack_version
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: cloud_configuration_ack_applied
    type: bool
    restore_value: false
    initial_value: "false"
  - id: cloud_configuration_ack_error
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: cloud_led_alert_active
    type: bool
    restore_value: false
    initial_value: "false"
  - id: cloud_last_co2_alert_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: cloud_last_co2_alert_severity
    type: int
    restore_value: false
    initial_value: "0"
  - id: cloud_led_runtime_state
    type: int
    restore_value: false
    initial_value: "-1"
  - id: cloud_led_automation_ready
    type: bool
    restore_value: false
    initial_value: "false"
  - id: cloud_last_network_connected
    type: bool
    restore_value: false
    initial_value: "false"

  - id: cloud_has_pm
    type: bool
    restore_value: false
    initial_value: "false"
  - id: cloud_pm_1_0
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: cloud_pm_2_5
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: cloud_pm_4_0
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: cloud_pm_10_0
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: cloud_pmc_0_5
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: cloud_pmc_1_0
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: cloud_pmc_2_5
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: cloud_pmc_4_0
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: cloud_pmc_10_0
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: cloud_pm_size
    type: float
    restore_value: false
    initial_value: "NAN"

  - id: cloud_has_zones
    type: bool
    restore_value: false
    initial_value: "false"
  - id: cloud_zone1_count
    type: int
    restore_value: false
    initial_value: "-1"
  - id: cloud_zone2_count
    type: int
    restore_value: false
    initial_value: "-1"
  - id: cloud_zone3_count
    type: int
    restore_value: false
    initial_value: "-1"
  - id: cloud_zone4_count
    type: int
    restore_value: false
    initial_value: "-1"

button:
  - platform: template
    id: cloud_reset_button
    name: "${friendly_name} Reset Cloud"
    icon: "mdi:cloud-off"
    entity_category: config
    on_press:
      - script.execute: cloud_reset

binary_sensor:
  - platform: template
    id: cloud_connected
    name: "${friendly_name} Cloud Connected"
    icon: "mdi:cloud-check"
    entity_category: diagnostic
    lambda: |-
      return id(cloud_is_registered) && id(cloud_last_sync_success);

sensor:
  - platform: template
    id: cloud_sync_failure_count
    name: "${friendly_name} Cloud Sync Failures"
    entity_category: diagnostic
    icon: "mdi:alert-circle"
    accuracy_decimals: 0
    lambda: "return id(cloud_sync_failures);"
    update_interval: 60s

text_sensor:
  - platform: template
    id: cloud_device_id_sensor
    name: "${friendly_name} Cloud Device ID"
    entity_category: diagnostic
    icon: "mdi:cloud-outline"
    lambda: |-
      if (id(cloud_device_id).length() > 0) {
        return id(cloud_device_id);
      }
      return {"Not registered"};
    update_interval: 60s

  - platform: template
    id: cloud_status_text
    name: "${friendly_name} Cloud Status"
    entity_category: diagnostic
    icon: "mdi:cloud-question"
    lambda: |-
      if (!id(cloud_is_registered)) {
        return {"Registering..."};
      }
      if (id(cloud_device_token).length() == 0) {
        return {"No token"};
      }
      if (id(cloud_sync_failures) > 10) {
        return {"Error"};
      }
      if (id(cloud_last_sync_success)) {
        return {"Connected"};
      }
      return {"Syncing..."};
    update_interval: 15s

script:
  - id: cloud_register
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              return id(cloud_is_registering)
                || id(cloud_http_request_busy)
                || !network::is_connected();
          then:
            - script.stop: cloud_register

      - lambda: "id(cloud_is_registering) = true;"

      - wait_until:
          condition:
            lambda: "return id(${cloud_mac_sensor_id}).has_state();"
          timeout: 30s

      - wait_until:
          condition:
            lambda: "return id(${cloud_ip_sensor_id}).has_state();"
          timeout: 30s

      - lambda: "id(cloud_http_request_busy) = true;"
      - http_request.post:
          url: "${cloud_api_url}/api/${cloud_api_version}/devices/register"
          request_headers:
            Content-Type: "application/json"
            User-Agent: "UltimateSensor/${ultimatesensor_software_version}"
            Accept: "application/json"
          json: |-
            root["mac_address"] = id(${cloud_mac_sensor_id}).state;
            root["hardware_version"] = "${ultimatesensor_hardware_version}";
            root["firmware_version"] = "${ultimatesensor_software_version}";
            root["product"] = "ultimatesensor";
            root["local_ip"] = id(${cloud_ip_sensor_id}).state;
            root["configuration_protocol_version"] = 1;
          capture_response: true
          max_response_buffer_size: 512
          on_response:
            then:
              - lambda: |-
                  id(cloud_is_registering) = false;
                  id(cloud_http_request_busy) = false;

                  if (response->status_code == 200 || response->status_code == 201) {
                    json::parse_json(body, [](JsonObject root) -> bool {
                      if (root["device_id"].is<const char*>() && root["token"].is<const char*>()) {
                        id(cloud_device_id) = root["device_id"].as<std::string>();
                        id(cloud_device_token) = root["token"].as<std::string>();
                        id(cloud_is_registered) = true;
                        id(cloud_sync_failures) = 0;
                        if (root["configuration_version"].is<uint32_t>()) {
                          id(cloud_desired_configuration_version) =
                            root["configuration_version"].as<uint32_t>();
                        }
                        return true;
                      }
                      return false;
                    });
                    if (id(cloud_is_registered)) {
                      id(cloud_voice_client).set_credentials(
                        id(cloud_device_id),
                        id(cloud_device_token)
                      );
                    }
                  } else {
                    id(cloud_sync_failures)++;
                  }
              - if:
                  condition:
                    lambda: "return id(cloud_is_registered) && !id(cloud_configuration_syncing);"
                  then:
                    - script.execute: cloud_sync_configuration
          on_error:
            then:
              - lambda: |-
                  id(cloud_sync_failures)++;
                  id(cloud_is_registering) = false;
                  id(cloud_http_request_busy) = false;

  - id: cloud_send_batch
    mode: single
    then:
      - if:
          condition:
            lambda: "return !id(cloud_is_registered);"
          then:
            - script.execute: cloud_register
            - script.stop: cloud_send_batch

      - if:
          condition:
            lambda: "return id(cloud_device_token).length() == 0;"
          then:
            - lambda: "id(cloud_is_registered) = false;"
            - script.execute: cloud_register
            - script.stop: cloud_send_batch

      - if:
          condition:
            lambda: |-
              const std::string voice_state = id(cloud_voice_client).state_name();
              return id(cloud_http_request_busy)
                || voice_state == "listening"
                || voice_state == "thinking"
                || voice_state == "replying";
          then:
            - script.stop: cloud_send_batch

      - lambda: "id(cloud_last_sync_success) = false;"

      - lambda: "id(cloud_http_request_busy) = true;"
      - http_request.post:
          url: "${cloud_api_url}/api/${cloud_api_version}/devices/ingest"
          request_headers:
            Content-Type: "application/json"
            Authorization: !lambda |-
              static std::string auth;
              auth = "Bearer ";
              auth += id(cloud_device_token);
              return auth.c_str();
            User-Agent: "UltimateSensor/${ultimatesensor_software_version}"
            Accept: "application/json"
          capture_response: true
          max_response_buffer_size: 256
          json: |-
            root["device_id"] = id(cloud_device_id);
            root["timestamp"] = id(sntp_cloud_time).now().timestamp;

            if (id(scd41_co2).has_state() && !isnan(id(scd41_co2).state)) {
              root["co2_ppm"] = id(scd41_co2).state;
            }
            if (id(scd41_temperature).has_state() && !isnan(id(scd41_temperature).state)) {
              root["temperature_c"] = id(scd41_temperature).state;
            }
            if (id(scd41_humidity).has_state() && !isnan(id(scd41_humidity).state)) {
              root["humidity_pct"] = id(scd41_humidity).state;
            }
            if (id(cpu_temperature).has_state() && !isnan(id(cpu_temperature).state)) {
              root["cpu_temperature_c"] = id(cpu_temperature).state;
            }
            if (id(illuminance).has_state() && !isnan(id(illuminance).state)) {
              root["illuminance_lux"] = id(illuminance).state;
            }
            if (id(voc_index).has_state() && !isnan(id(voc_index).state)) {
              root["voc_index"] = id(voc_index).state;
            }
            if (id(nox_index).has_state() && !isnan(id(nox_index).state)) {
              root["nox_index"] = id(nox_index).state;
            }

            root["occupancy"] = id(occupancy).state;

            if (id(cloud_has_zones)) {
              if (id(cloud_zone1_count) >= 0) root["zone1_target_count"] = id(cloud_zone1_count);
              if (id(cloud_zone2_count) >= 0) root["zone2_target_count"] = id(cloud_zone2_count);
              if (id(cloud_zone3_count) >= 0) root["zone3_target_count"] = id(cloud_zone3_count);
              if (id(cloud_zone4_count) >= 0) root["zone4_target_count"] = id(cloud_zone4_count);
            }

            if (id(cloud_has_pm)) {
              if (!isnan(id(cloud_pm_1_0))) root["pm_1_0_ugm3"] = id(cloud_pm_1_0);
              if (!isnan(id(cloud_pm_2_5))) root["pm_2_5_ugm3"] = id(cloud_pm_2_5);
              if (!isnan(id(cloud_pm_4_0))) root["pm_4_0_ugm3"] = id(cloud_pm_4_0);
              if (!isnan(id(cloud_pm_10_0))) root["pm_10_0_ugm3"] = id(cloud_pm_10_0);
              if (!isnan(id(cloud_pmc_0_5))) root["pmc_0_5"] = id(cloud_pmc_0_5);
              if (!isnan(id(cloud_pmc_1_0))) root["pmc_1_0"] = id(cloud_pmc_1_0);
              if (!isnan(id(cloud_pmc_2_5))) root["pmc_2_5"] = id(cloud_pmc_2_5);
              if (!isnan(id(cloud_pmc_4_0))) root["pmc_4_0"] = id(cloud_pmc_4_0);
              if (!isnan(id(cloud_pmc_10_0))) root["pmc_10_0"] = id(cloud_pmc_10_0);
              if (!isnan(id(cloud_pm_size))) root["pm_size"] = id(cloud_pm_size);
            }

            root["firmware_version"] = "${ultimatesensor_software_version}";
            root["hardware_version"] = "${ultimatesensor_hardware_version}";
            root["configuration_protocol_version"] = 1;
          on_response:
            then:
              - lambda: |-
                  id(cloud_http_request_busy) = false;
                  if (response->status_code == 200) {
                    id(cloud_last_sync_success) = true;
                    id(cloud_sync_failures) = 0;
                    json::parse_json(body, [](JsonObject root) -> bool {
                      if (root["configuration_version"].is<uint32_t>()) {
                        id(cloud_desired_configuration_version) =
                          root["configuration_version"].as<uint32_t>();
                      }
                      return true;
                    });
                  } else if (response->status_code == 401) {
                    id(cloud_is_registered) = false;
                    id(cloud_device_token) = "";
                    id(cloud_voice_client).clear_credentials();
                    id(cloud_sync_failures)++;
                  } else {
                    id(cloud_sync_failures)++;
                  }
              - if:
                  condition:
                    lambda: |-
                      return id(cloud_is_registered)
                        && !id(cloud_configuration_syncing)
                        && (
                          !id(cloud_configuration_boot_sync_done)
                          || id(cloud_desired_configuration_version)
                            != id(cloud_led_configuration_version)
                        );
                  then:
                    - script.execute: cloud_sync_configuration
          on_error:
            then:
              - lambda: |-
                  id(cloud_http_request_busy) = false;
                  id(cloud_last_sync_success) = false;
                  id(cloud_sync_failures)++;

  - id: cloud_sync_voice_settings
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              return !network::is_connected()
                || !id(cloud_is_registered)
                || id(cloud_device_token).empty();
          then:
            - lambda: |-
                id(cloud_voice_client).set_cloud_enabled(false);
            - script.stop: cloud_sync_voice_settings
      - if:
          condition:
            lambda: |-
              const std::string voice_state = id(cloud_voice_client).state_name();
              return id(cloud_voice_settings_syncing)
                || id(cloud_http_request_busy)
                || voice_state == "listening"
                || voice_state == "thinking"
                || voice_state == "replying";
          then:
            - script.stop: cloud_sync_voice_settings
      - lambda: |-
          id(cloud_voice_settings_syncing) = true;
          id(cloud_http_request_busy) = true;
      - http_request.get:
          url: "${cloud_api_url}/api/${cloud_api_version}/devices/voice/settings"
          request_headers:
            Authorization: !lambda |-
              static std::string auth;
              auth = "Bearer ";
              auth += id(cloud_device_token);
              return auth.c_str();
            User-Agent: "UltimateSensor/${ultimatesensor_software_version}"
            Accept: "application/json"
          capture_response: true
          max_response_buffer_size: 1024
          on_response:
            then:
              - lambda: |-
                  id(cloud_voice_settings_syncing) = false;
                  id(cloud_http_request_busy) = false;

                  if (response->status_code == 401) {
                    id(cloud_is_registered) = false;
                    id(cloud_device_token) = "";
                    id(cloud_voice_client).clear_credentials();
                    return;
                  }

                  if (response->status_code == 403) {
                    id(cloud_voice_client).set_cloud_enabled(false);
                    return;
                  }

                  if (response->status_code != 200) {
                    return;
                  }

                  bool parsed = false;
                  json::parse_json(body, [&parsed](JsonObject root) -> bool {
                    if (!root["cloud_voice_enabled"].is<bool>()
                        || !root["hands_free_follow_up_enabled"].is<bool>()
                        || !root["follow_up_timeout_seconds"].is<int>()
                        || !root["max_follow_up_turns"].is<int>()
                        || !root["speaker_volume"].is<int>()) {
                      return false;
                    }

                    const int volume = root["speaker_volume"].as<int>();
                    const int timeout = root["follow_up_timeout_seconds"].as<int>();
                    const int max_turns = root["max_follow_up_turns"].as<int>();
                    if (volume < 0 || volume > 100
                        || timeout < 3 || timeout > 15
                        || max_turns < 0 || max_turns > 2) {
                      return false;
                    }

                    id(cloud_speaker_volume) = volume;
                    id(cloud_voice_client).set_speaker_volume(volume);
                    id(cloud_voice_client).set_follow_up_settings(
                      root["hands_free_follow_up_enabled"].as<bool>(),
                      timeout,
                      max_turns
                    );
                    id(cloud_voice_client).set_cloud_enabled(
                      root["cloud_voice_enabled"].as<bool>()
                    );
                    parsed = true;
                    return true;
                  });

                  if (!parsed) {
                    id(cloud_voice_client).set_cloud_enabled(false);
                  }
          on_error:
            then:
              - lambda: |-
                  id(cloud_voice_settings_syncing) = false;
                  id(cloud_http_request_busy) = false;

  - id: cloud_sync_configuration
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              return !network::is_connected()
                || !id(cloud_is_registered)
                || id(cloud_device_token).empty()
                || id(cloud_configuration_syncing)
                || id(cloud_http_request_busy);
          then:
            - script.stop: cloud_sync_configuration
      - lambda: |-
          id(cloud_configuration_syncing) = true;
          id(cloud_http_request_busy) = true;
          id(cloud_configuration_ack_version) = 0;
          id(cloud_configuration_ack_applied) = false;
          id(cloud_configuration_ack_error) = "";
      - http_request.get:
          url: "${cloud_api_url}/api/${cloud_api_version}/devices/configuration"
          request_headers:
            Authorization: !lambda |-
              static std::string auth;
              auth = "Bearer ";
              auth += id(cloud_device_token);
              return auth.c_str();
            User-Agent: "UltimateSensor/${ultimatesensor_software_version}"
            Accept: "application/json"
          capture_response: true
          max_response_buffer_size: 2048
          on_response:
            then:
              - lambda: |-
                  id(cloud_configuration_syncing) = false;
                  id(cloud_http_request_busy) = false;
                  id(cloud_speaker_test_pending) = false;

                  if (response->status_code != 200) {
                    return;
                  }

                  const bool parsed = json::parse_json(body, [](JsonObject root) -> bool {
                    if (!root["configuration_version"].is<uint32_t>()
                        || !root["configuration"].is<JsonObject>()) {
                      id(cloud_configuration_ack_error) = "Invalid configuration envelope";
                      return false;
                    }

                    const uint32_t version = root["configuration_version"].as<uint32_t>();
                    JsonObject configuration = root["configuration"].as<JsonObject>();
                    id(cloud_configuration_ack_version) = version;
                    id(cloud_desired_configuration_version) = version;

                    const bool quiet_settings_present =
                      !configuration["sps30_quiet_hours_enabled"].isNull()
                      || !configuration["sps30_quiet_start_hour"].isNull()
                      || !configuration["sps30_quiet_end_hour"].isNull();
                    const bool valid_quiet_types = !quiet_settings_present || (
                      configuration["sps30_quiet_hours_enabled"].is<bool>()
                      && configuration["sps30_quiet_start_hour"].is<int>()
                      && configuration["sps30_quiet_end_hour"].is<int>()
                    );

                    const bool valid_types =
                      configuration["led_enabled"].is<bool>()
                      && configuration["speaker_volume"].is<int>()
                      && configuration["speaker_test_sequence"].is<int>()
                      && configuration["motion_light_enabled"].is<bool>()
                      && configuration["motion_light_brightness"].is<int>()
                      && configuration["night_light_enabled"].is<bool>()
                      && configuration["night_light_brightness"].is<int>()
                      && configuration["night_light_start_hour"].is<int>()
                      && configuration["night_light_end_hour"].is<int>()
                      && configuration["co2_alert_enabled"].is<bool>()
                      && configuration["co2_warning_ppm"].is<int>()
                      && configuration["co2_critical_ppm"].is<int>()
                      && configuration["co2_alert_cooldown_minutes"].is<int>();

                    if (!valid_types || !valid_quiet_types) {
                      id(cloud_configuration_ack_error) =
                        "Missing or invalid LED configuration setting";
                      return false;
                    }

                    const int motion_brightness =
                      configuration["motion_light_brightness"].as<int>();
                    const int speaker_volume =
                      configuration["speaker_volume"].as<int>();
                    const int speaker_test_sequence =
                      configuration["speaker_test_sequence"].as<int>();
                    const int night_brightness =
                      configuration["night_light_brightness"].as<int>();
                    const int night_start =
                      configuration["night_light_start_hour"].as<int>();
                    const int night_end =
                      configuration["night_light_end_hour"].as<int>();
                    const int co2_warning =
                      configuration["co2_warning_ppm"].as<int>();
                    const int co2_critical =
                      configuration["co2_critical_ppm"].as<int>();
                    const int co2_cooldown =
                      configuration["co2_alert_cooldown_minutes"].as<int>();
                    const int quiet_start = quiet_settings_present
                      ? configuration["sps30_quiet_start_hour"].as<int>()
                      : id(cloud_sps30_quiet_start_hour);
                    const int quiet_end = quiet_settings_present
                      ? configuration["sps30_quiet_end_hour"].as<int>()
                      : id(cloud_sps30_quiet_end_hour);

                    const bool valid_values =
                      speaker_volume >= 0 && speaker_volume <= 100
                      && speaker_test_sequence >= 0
                      && motion_brightness >= 1 && motion_brightness <= 100
                      && night_brightness >= 1 && night_brightness <= 100
                      && night_start >= 0 && night_start <= 23
                      && night_end >= 0 && night_end <= 23
                      && co2_warning >= 400 && co2_warning <= 5000
                      && co2_critical >= 500 && co2_critical <= 10000
                      && co2_critical > co2_warning
                      && co2_cooldown >= 1 && co2_cooldown <= 1440
                      && (!quiet_settings_present || (
                        quiet_start >= 0 && quiet_start <= 23
                        && quiet_end >= 0 && quiet_end <= 23
                      ));

                    if (!valid_values) {
                      id(cloud_configuration_ack_error) =
                        "Configuration values are outside the supported range";
                      return false;
                    }

                    id(cloud_led_enabled) = configuration["led_enabled"].as<bool>();
                    id(cloud_speaker_volume) = speaker_volume;
                    id(cloud_speaker_test_pending) =
                      speaker_test_sequence > id(cloud_speaker_test_sequence);
                    id(cloud_speaker_test_sequence) = speaker_test_sequence;
                    id(cloud_motion_light_enabled) =
                      configuration["motion_light_enabled"].as<bool>();
                    id(cloud_motion_light_brightness) = motion_brightness;
                    id(cloud_night_light_enabled) =
                      configuration["night_light_enabled"].as<bool>();
                    id(cloud_night_light_brightness) = night_brightness;
                    id(cloud_night_light_start_hour) = night_start;
                    id(cloud_night_light_end_hour) = night_end;
                    id(cloud_co2_alert_enabled) =
                      configuration["co2_alert_enabled"].as<bool>();
                    id(cloud_co2_warning_ppm) = co2_warning;
                    id(cloud_co2_critical_ppm) = co2_critical;
                    id(cloud_co2_alert_cooldown_minutes) = co2_cooldown;
                    if (quiet_settings_present) {
                      id(cloud_sps30_quiet_settings_present) = true;
                      id(cloud_sps30_quiet_hours_enabled) =
                        configuration["sps30_quiet_hours_enabled"].as<bool>();
                      id(cloud_sps30_quiet_start_hour) = quiet_start;
                      id(cloud_sps30_quiet_end_hour) = quiet_end;
                      id(cloud_sps30_quiet_settings_revision)++;
                    }
                    id(cloud_led_configuration_version) = version;
                    id(cloud_configuration_ack_applied) = true;
                    id(cloud_configuration_ack_error) = "";
                    id(cloud_led_runtime_state) = -1;
                    id(cloud_last_co2_alert_ms) = 0;
                    id(cloud_last_co2_alert_severity) = 0;

                    return true;
                  });

                  if (!parsed && id(cloud_configuration_ack_version) == 0) {
                    id(cloud_configuration_ack_error) = "Unable to parse configuration";
                  }
              - if:
                  condition:
                    lambda: "return id(cloud_configuration_ack_applied);"
                  then:
                    - media_player.volume_set:
                        id: media_player_01
                        volume: !lambda "return id(cloud_speaker_volume) / 100.0f;"
                    - lambda: |-
                        id(cloud_voice_client).set_speaker_volume(
                          id(cloud_speaker_volume)
                        );
              - if:
                  condition:
                    lambda: "return id(cloud_speaker_test_pending);"
                  then:
                    - media_player.play_media:
                        id: media_player_01
                        media_url: "${cloud_speaker_test_url}"
                        announcement: true
                    - lambda: "id(cloud_speaker_test_pending) = false;"
              - if:
                  condition:
                    lambda: "return id(cloud_configuration_ack_version) > 0;"
                  then:
                    - script.execute: cloud_ack_configuration
              - delay: 2s
              - script.execute: cloud_sync_voice_settings
          on_error:
            then:
              - lambda: |-
                  id(cloud_configuration_syncing) = false;
                  id(cloud_http_request_busy) = false;

  - id: cloud_ack_configuration
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              return !network::is_connected()
                || !id(cloud_is_registered)
                || id(cloud_device_token).empty()
                || id(cloud_configuration_ack_version) == 0
                || id(cloud_http_request_busy);
          then:
            - script.stop: cloud_ack_configuration
      - lambda: "id(cloud_http_request_busy) = true;"
      - http_request.post:
          url: "${cloud_api_url}/api/${cloud_api_version}/devices/configuration/acknowledge"
          request_headers:
            Content-Type: "application/json"
            Authorization: !lambda |-
              static std::string auth;
              auth = "Bearer ";
              auth += id(cloud_device_token);
              return auth.c_str();
            User-Agent: "UltimateSensor/${ultimatesensor_software_version}"
            Accept: "application/json"
          json: |-
            root["type"] = "configuration_applied";
            root["device_id"] = id(cloud_device_id);
            root["configuration_version"] = id(cloud_configuration_ack_version);
            root["applied"] = id(cloud_configuration_ack_applied);

            JsonObject configuration = root["configuration"].to<JsonObject>();
            configuration["led_enabled"] = id(cloud_led_enabled);
            configuration["speaker_volume"] = id(cloud_speaker_volume);
            configuration["speaker_test_sequence"] = id(cloud_speaker_test_sequence);
            configuration["motion_light_enabled"] = id(cloud_motion_light_enabled);
            configuration["motion_light_brightness"] = id(cloud_motion_light_brightness);
            configuration["night_light_enabled"] = id(cloud_night_light_enabled);
            configuration["night_light_brightness"] = id(cloud_night_light_brightness);
            configuration["night_light_start_hour"] = id(cloud_night_light_start_hour);
            configuration["night_light_end_hour"] = id(cloud_night_light_end_hour);
            configuration["co2_alert_enabled"] = id(cloud_co2_alert_enabled);
            configuration["co2_warning_ppm"] = id(cloud_co2_warning_ppm);
            configuration["co2_critical_ppm"] = id(cloud_co2_critical_ppm);
            configuration["co2_alert_cooldown_minutes"] =
              id(cloud_co2_alert_cooldown_minutes);
            if (id(cloud_sps30_quiet_settings_present)) {
              configuration["sps30_quiet_hours_enabled"] =
                id(cloud_sps30_quiet_hours_enabled);
              configuration["sps30_quiet_start_hour"] =
                id(cloud_sps30_quiet_start_hour);
              configuration["sps30_quiet_end_hour"] =
                id(cloud_sps30_quiet_end_hour);
            }

            if (!id(cloud_configuration_ack_error).empty()) {
              root["error"] = id(cloud_configuration_ack_error);
            }
          capture_response: true
          max_response_buffer_size: 256
          on_response:
            then:
              - lambda: "id(cloud_http_request_busy) = false;"
              - if:
                  condition:
                    lambda: |-
                      return response->status_code == 200
                        && id(cloud_configuration_ack_applied);
                  then:
                    - lambda: "id(cloud_configuration_boot_sync_done) = true;"
          on_error:
            then:
              - lambda: "id(cloud_http_request_busy) = false;"

  - id: cloud_flash_co2_alert
    mode: single
    parameters:
      critical: bool
    then:
      - lambda: |-
          id(cloud_led_alert_active) = true;
          id(cloud_led_runtime_state) = critical ? 4 : 3;
      - repeat:
          count: 3
          then:
            - if:
                condition:
                  lambda: |-
                    return id(cloud_led_enabled)
                      && id(cloud_co2_alert_enabled)
                      && !id(boot_animation_active)
                      && (
                        id(voice_assistant_phase) == ${voice_assist_idle_phase_id}
                        || id(voice_assistant_phase) == ${voice_assist_muted_phase_id}
                      );
                then:
                  - light.turn_on:
                      id: rgb_front_led
                      brightness: 100%
                      red: 100%
                      green: !lambda "return critical ? 0.0f : 0.35f;"
                      blue: 0%
                      effect: none
            - delay: 250ms
            - if:
                condition:
                  lambda: |-
                    return !id(boot_animation_active)
                      && (
                        id(voice_assistant_phase) == ${voice_assist_idle_phase_id}
                        || id(voice_assistant_phase) == ${voice_assist_muted_phase_id}
                      );
                then:
                  - light.turn_off: rgb_front_led
            - delay: 250ms
      - lambda: |-
          id(cloud_led_alert_active) = false;
          id(cloud_led_runtime_state) = -1;

  - id: cloud_reset
    mode: single
    then:
      - lambda: |-
          id(cloud_device_id) = "";
          id(cloud_device_token) = "";
          id(cloud_is_registered) = false;
          id(cloud_last_sync_success) = false;
          id(cloud_sync_failures) = 0;
          id(cloud_has_pm) = false;
          id(cloud_has_zones) = false;
          id(cloud_last_presence_signature) = -1;
          id(cloud_configuration_boot_sync_done) = false;
          id(cloud_voice_settings_syncing) = false;
          id(cloud_http_request_busy) = false;
          id(cloud_voice_client).clear_credentials();
      - delay: 5s
      - script.execute: cloud_register

  - id: cloud_send_presence_if_changed
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              int signature = id(occupancy).state ? 1 : 0;
              if (id(cloud_has_zones)) {
                signature = signature * 31 + id(cloud_zone1_count);
                signature = signature * 31 + id(cloud_zone2_count);
                signature = signature * 31 + id(cloud_zone3_count);
                signature = signature * 31 + id(cloud_zone4_count);
              }
              return signature == id(cloud_last_presence_signature);
          then:
            - script.stop: cloud_send_presence_if_changed
      - lambda: |-
          int signature = id(occupancy).state ? 1 : 0;
          if (id(cloud_has_zones)) {
            signature = signature * 31 + id(cloud_zone1_count);
            signature = signature * 31 + id(cloud_zone2_count);
            signature = signature * 31 + id(cloud_zone3_count);
            signature = signature * 31 + id(cloud_zone4_count);
          }
          id(cloud_last_presence_signature) = signature;
      - script.execute: cloud_send_batch

# Cloud firmware status LED: the built-in status_led keeps blinking on the
# ESPHome API "waiting for client connection" warning, which is the normal
# state for cloud-only customers without Home Assistant. Replace it with
# connectivity behaviour: blink while offline or not set up, off once online.
status_led: !remove

output:
  - platform: gpio
    pin: GPIO44  # same pin the removed status_led used
    id: cloud_status_led_output

interval:
  - interval: 1s
    then:
      - lambda: |-
          if (!id(cloud_led_automation_ready)) {
            return;
          }

          const bool voice_led_available =
            id(voice_assistant_phase) == ${voice_assist_idle_phase_id}
            || id(voice_assistant_phase) == ${voice_assist_muted_phase_id};

          if (id(boot_animation_active) || !voice_led_available) {
            id(cloud_led_runtime_state) = -1;
            return;
          }

          if (id(cloud_led_alert_active)) {
            return;
          }

          if (!id(cloud_led_enabled)) {
            if (id(cloud_led_runtime_state) != 0) {
              id(rgb_front_led).turn_off().perform();
              id(cloud_led_runtime_state) = 0;
            }
            return;
          }

          int co2_severity = 0;
          if (id(cloud_co2_alert_enabled)
              && id(scd41_co2).has_state()
              && !isnan(id(scd41_co2).state)) {
            if (id(scd41_co2).state >= id(cloud_co2_critical_ppm)) {
              co2_severity = 2;
            } else if (id(scd41_co2).state >= id(cloud_co2_warning_ppm)) {
              co2_severity = 1;
            }
          }

          const bool severity_increased =
            co2_severity > id(cloud_last_co2_alert_severity);
          id(cloud_last_co2_alert_severity) = co2_severity;

          if (co2_severity == 0) {
            id(cloud_last_co2_alert_ms) = 0;
          } else {
            const uint32_t cooldown_ms =
              (uint32_t) id(cloud_co2_alert_cooldown_minutes) * 60000UL;
            const uint32_t elapsed_ms = millis() - id(cloud_last_co2_alert_ms);
            if (id(cloud_last_co2_alert_ms) == 0
                || elapsed_ms >= cooldown_ms
                || severity_increased) {
              id(cloud_last_co2_alert_ms) = millis();
              id(cloud_flash_co2_alert).execute(co2_severity == 2);
              return;
            }
          }

          const bool motion =
            id(pir_motion).state
            || id(ld2412_moving_target).state
            || id(${tracking_motion_sensor_id}).state;

          if (motion && id(cloud_motion_light_enabled)) {
            if (id(cloud_led_runtime_state) != 2) {
              auto call = id(rgb_front_led).turn_on();
              call.set_brightness(id(cloud_motion_light_brightness) / 100.0f);
              call.set_rgb(1.0f, 1.0f, 1.0f);
              call.set_effect("none");
              call.perform();
              id(cloud_led_runtime_state) = 2;
            }
            return;
          }

          const auto now = id(sntp_cloud_time).now();
          bool night = false;
          if (now.is_valid()) {
            const int hour = now.hour;
            const int start = id(cloud_night_light_start_hour);
            const int end = id(cloud_night_light_end_hour);
            night = start == end
              || (start < end && hour >= start && hour < end)
              || (start > end && (hour >= start || hour < end));
          }

          if (id(occupancy).state && night && id(cloud_night_light_enabled)) {
            if (id(cloud_led_runtime_state) != 1) {
              auto call = id(rgb_front_led).turn_on();
              call.set_brightness(id(cloud_night_light_brightness) / 100.0f);
              call.set_rgb(1.0f, 0.45f, 0.08f);
              call.set_effect("none");
              call.perform();
              id(cloud_led_runtime_state) = 1;
            }
            return;
          }

          if (id(cloud_led_runtime_state) != 0) {
            id(rgb_front_led).turn_off().perform();
            id(cloud_led_runtime_state) = 0;
          }

  - interval: 500ms
    then:
      - lambda: |-
          static bool cloud_led_on = false;
          if (network::is_connected()) {
            if (cloud_led_on) {
              id(cloud_status_led_output).turn_off();
              cloud_led_on = false;
            }
          } else {
            cloud_led_on = !cloud_led_on;
            if (cloud_led_on) {
              id(cloud_status_led_output).turn_on();
            } else {
              id(cloud_status_led_output).turn_off();
            }
          }
  - interval: 10s
    then:
      - lambda: |-
          const bool connected = network::is_connected();
          if (connected && !id(cloud_last_network_connected)) {
            id(cloud_configuration_boot_sync_done) = false;
            if (id(cloud_is_registered) && !id(cloud_configuration_syncing)) {
              id(cloud_sync_configuration).execute();
            }
          }
          id(cloud_last_network_connected) = connected;

  - interval: ${cloud_presence_sync_interval}
    then:
      - script.execute: cloud_send_presence_if_changed

  - interval: ${cloud_sync_interval}
    then:
      - script.execute: cloud_send_batch

  - interval: 37s
    then:
      - script.execute: cloud_sync_voice_settings

  - interval: 6h
    then:
      - script.execute: cloud_sync_configuration

# Cloud-only customers may never connect Home Assistant. Without this the
# native API reboots the device every 15 minutes ("No clients; rebooting"),
# so disable the no-client reboot on cloud firmware.
api:
  reboot_timeout: 0s
