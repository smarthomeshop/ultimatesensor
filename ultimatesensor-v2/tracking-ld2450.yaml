# Standard UltimateSensor V2 LD2450 tracking and stable wall-mount metadata.
# Factory hardware ships with LD2450 on GPIO11/GPIO12.

substitutions:
  ld2450_uart_tx_pin: GPIO11
  ld2450_uart_rx_pin: GPIO12
  tracking_motion_sensor_id: tracking_moving_target

packages:
  ld2450:
    url: https://github.com/smarthomeshop/ld2450
    ref: main
    files:
      - packages/ld2450-base.yaml
      - packages/ld2450-polygon-zones.yaml
    refresh: 1d
  radar_mounting: github://smarthomeshop/radar-mounting/packages/mounting/wall.yaml@v1.0.0
  radar_profile: github://smarthomeshop/radar-mounting/packages/radars/ld2450.yaml@v1.0.0
