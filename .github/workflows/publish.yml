      name: UltimateSensor Ethernet Basic
      clean: false
      esphome_version: latest
      directory_name: ultimatesensor-ethernet-basic
      software_version: ${{ needs.detect-changes.outputs.v1_version }}

  build-ultimatesensor-ethernet-complete:
