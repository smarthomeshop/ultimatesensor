          create_manifest "ultimatesensor-ethernet-complete-cloud" "ultimatesensor-ethernet-complete-cloud-manifest.json" "UltimateSensor Ethernet Complete Cloud" "${{ needs.detect-changes.outputs.v1_version }}"
