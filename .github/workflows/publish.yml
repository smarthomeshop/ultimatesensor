name: Build and Publish UltimateSensor firmware

on:
  pull_request:
  workflow_dispatch:
    inputs:
      force_all:
        description: "Force build all variants"
        required: false
        type: boolean
        default: false
  # Scheduled build: rebuild all firmware monthly with latest ESPHome.
  # ESPHome releases typically land around the 15th, so we rebuild on the
  # 20th to pick up the new release a few days later after initial fixes.
  schedule:
    - cron: "0 3 20 * *"
  push:
    branches:
      - main
    paths:
      - "CHANGELOG.md"
      - ".github/workflows/**"
      - "ultimatesensor-v1/**"
      - "ultimatesensor-v2/**"

permissions:
  contents: write

jobs:
  validate-changelog:
    name: Validate changelog updates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require changelog update for firmware changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" != "pull_request" && "${{ github.event_name }}" != "push" ]]; then
            echo "Event does not require changelog validation"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "push" && "${{ github.actor }}" == "github-actions[bot]" ]]; then
            echo "Skipping changelog validation for GitHub Actions version bump commit"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA=${{ github.event.pull_request.base.sha }}
            HEAD_SHA=${{ github.event.pull_request.head.sha }}
          else
            BASE_SHA=${{ github.event.before }}
            HEAD_SHA=${{ github.sha }}
          fi

          if [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "First push detected; skipping changelog validation"
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"
          echo "$CHANGED_FILES"

          if ! echo "$CHANGED_FILES" | grep -Eq '^ultimatesensor-v[12]/.*\.ya?ml$'; then
            echo "No firmware YAML changes detected; changelog update not required"
            exit 0
          fi

          if echo "$CHANGED_FILES" | grep -qx 'CHANGELOG.md'; then
            unreleased_notes=$(mktemp)
            awk '
              $0 == "## [Unreleased]" { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md \
              | sed '/^- Add customer-facing firmware notes here before merging a PR\.$/d' \
              > "$unreleased_notes"

            if grep -q '[^[:space:]]' "$unreleased_notes"; then
              echo "CHANGELOG.md updated with Unreleased notes"
              rm -f "$unreleased_notes"
              exit 0
            fi

            rm -f "$unreleased_notes"
            echo "::error file=CHANGELOG.md::Firmware YAML changes require a customer-facing note under ## [Unreleased]."
            exit 1
          fi

          echo "::error file=CHANGELOG.md::Firmware YAML changes require a customer-facing CHANGELOG.md update."
          exit 1

  detect-changes:
    name: Detect changed versions
    needs: [validate-changelog]
    runs-on: ubuntu-latest
    outputs:
      v1_changed: ${{ steps.changes.outputs.v1 }}
      v1_build: ${{ steps.changes.outputs.v1_build }}
      v2_changed: ${{ steps.changes.outputs.v2 }}
      v2_build: ${{ steps.changes.outputs.v2_build }}
      v1_version: ${{ steps.versions.outputs.v1_version }}
      v2_version: ${{ steps.versions.outputs.v2_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for changes in each version
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force_all }}" == "true" ]]; then
            echo "Force building all variants"
            echo "v1=true" >> "$GITHUB_OUTPUT"
            echo "v1_build=true" >> "$GITHUB_OUTPUT"
            echo "v2=true" >> "$GITHUB_OUTPUT"
            echo "v2_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "Scheduled build - rebuilding all variants with latest ESPHome"
            echo "v1=true" >> "$GITHUB_OUTPUT"
            echo "v1_build=true" >> "$GITHUB_OUTPUT"
            echo "v2=true" >> "$GITHUB_OUTPUT"
            echo "v2_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "Tag detected, building all variants"
            echo "v1=true" >> "$GITHUB_OUTPUT"
            echo "v1_build=true" >> "$GITHUB_OUTPUT"
            echo "v2=true" >> "$GITHUB_OUTPUT"
            echo "v2_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA=${{ github.event.pull_request.base.sha }}
            HEAD_SHA=${{ github.event.pull_request.head.sha }}
          else
            BASE_SHA=${{ github.event.before }}
            HEAD_SHA=${{ github.sha }}
          fi

          if [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "First push detected, building all variants"
            echo "v1=true" >> "$GITHUB_OUTPUT"
            echo "v1_build=true" >> "$GITHUB_OUTPUT"
            echo "v2=true" >> "$GITHUB_OUTPUT"
            echo "v2_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"
          echo "$CHANGED_FILES"

          V1_CHANGED=$(echo "$CHANGED_FILES" | grep -Eq '^ultimatesensor-v1/.*\.ya?ml$' && echo "true" || echo "false")
          V2_CHANGED=$(echo "$CHANGED_FILES" | grep -Eq '^ultimatesensor-v2/.*\.ya?ml$' && echo "true" || echo "false")
          WORKFLOW_CHANGED=$(echo "$CHANGED_FILES" | grep -q '^.github/workflows/' && echo "true" || echo "false")

          if [[ "$WORKFLOW_CHANGED" == "true" ]]; then
            echo "Workflow changes detected; rebuilding all variants while preserving real firmware change detection"
          fi

          echo "v1=$V1_CHANGED" >> "$GITHUB_OUTPUT"
          echo "v2=$V2_CHANGED" >> "$GITHUB_OUTPUT"

          if [[ "$WORKFLOW_CHANGED" == "true" ]]; then
            echo "v1_build=true" >> "$GITHUB_OUTPUT"
            echo "v2_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "v1_build=$V1_CHANGED" >> "$GITHUB_OUTPUT"
            echo "v2_build=$V2_CHANGED" >> "$GITHUB_OUTPUT"
          fi

          echo "V1 changed: $V1_CHANGED"
          echo "V2 changed: $V2_CHANGED"

      - name: Update version numbers for changed versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          IS_SCHEDULED="${{ github.event_name == 'schedule' }}"
          V1_VERSION_FILE="ultimatesensor-v1/ultimatesensor-wifi-basic.yaml"
          V2_VERSION_FILE="ultimatesensor-v2/base.yaml"

          git fetch --tags --force >/dev/null 2>&1 || true

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA=${{ github.event.pull_request.base.sha }}
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            BASE_SHA=${{ github.event.before }}
          else
            BASE_SHA=""
          fi

          read_version() {
            local file=$1
            local key=$2
            local fallback=$3

            awk -F'"' -v key="$key" '$0 ~ "^[[:space:]]*" key ":[[:space:]]*\\\"" { print $2; exit }' "$file" 2>/dev/null || true
          }

          increment_version() {
            local current_version=$1

            if [[ "$IS_SCHEDULED" == "true" ]]; then
              echo "$current_version"
              return
            fi

            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              echo "$current_version"
              return
            fi

            if [[ "$current_version" =~ ^([0-9]+)\.([0-9]+)(.*)$ ]]; then
              local major="${BASH_REMATCH[1]}"
              local minor="${BASH_REMATCH[2]}"
              local suffix="${BASH_REMATCH[3]}"
              echo "${major}.$((minor + 1))${suffix}"
            else
              local shortsha
              shortsha=$(echo "${GITHUB_SHA}" | cut -c1-7)
              echo "dev-${shortsha}"
            fi
          }

          version_for_change() {
            local output_name=$1
            local file=$2
            local key=$3
            local fallback=$4
            local changed=$5
            local release_tag_prefix=$6
            local current_version
            local new_version

            current_version=$(read_version "$file" "$key" "$fallback")
            current_version=${current_version:-$fallback}
            echo "Current version for $file: $current_version"

            if [[ "$changed" != "true" ]]; then
              echo "${output_name}=${current_version}" >> "$GITHUB_OUTPUT"
              return
            fi

            if [[ -n "$BASE_SHA" ]] && ! git cat-file -e "${BASE_SHA}:${file}" 2>/dev/null; then
              echo "${output_name}=${current_version}" >> "$GITHUB_OUTPUT"
              echo "Initial release for $file - keeping version: $current_version"
              return
            fi

            if [[ -n "$release_tag_prefix" ]] && ! git rev-parse -q --verify "refs/tags/${release_tag_prefix}-${current_version}" >/dev/null; then
              echo "${output_name}=${current_version}" >> "$GITHUB_OUTPUT"
              echo "No release tag found for ${release_tag_prefix}-${current_version} - keeping version: $current_version"
              return
            fi

            new_version=$(increment_version "$current_version")
            echo "${output_name}=${new_version}" >> "$GITHUB_OUTPUT"
            echo "New version for $file: $new_version"
          }

          version_for_change "v1_version" "$V1_VERSION_FILE" "ultimatesensor_software_version" "1.0" "${{ steps.changes.outputs.v1 }}" "ultimatesensor-v1"
          version_for_change "v2_version" "$V2_VERSION_FILE" "ultimatesensor_software_version" "1.0" "${{ steps.changes.outputs.v2 }}" "ultimatesensor-v2"

      - name: Commit version updates and create tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          version_files_v1=(
            "ultimatesensor-v1/ultimatesensor-wifi-basic.yaml"
            "ultimatesensor-v1/ultimatesensor-wifi-complete.yaml"
            "ultimatesensor-v1/ultimatesensor-ethernet-basic.yaml"
            "ultimatesensor-v1/ultimatesensor-ethernet-complete.yaml"
            "ultimatesensor-v1/ultimatesensor-wifi-basic-cloud.yaml"
            "ultimatesensor-v1/ultimatesensor-wifi-complete-cloud.yaml"
            "ultimatesensor-v1/ultimatesensor-ethernet-basic-cloud.yaml"
            "ultimatesensor-v1/ultimatesensor-ethernet-complete-cloud.yaml"
          )
          version_files_v2=(
            "ultimatesensor-v2/base.yaml"
          )

          finalize_changelog() {
            local unreleased_notes
            local release_blocks
            local release_date

            unreleased_notes=$(mktemp)
            release_blocks=$(mktemp)
            release_date=$(TZ=Europe/Amsterdam date +%Y-%m-%d)

            awk '
              $0 == "## [Unreleased]" { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md \
              | sed '/^- Add customer-facing firmware notes here before merging a PR\.$/d' \
              > "$unreleased_notes"

            if ! grep -q '[^[:space:]]' "$unreleased_notes"; then
              echo "No unreleased changelog notes to finalize"
              rm -f "$unreleased_notes" "$release_blocks"
              return
            fi

            if [[ "${{ steps.changes.outputs.v1 }}" == "true" ]]; then
              {
                printf '## [UltimateSensor V1 %s] - %s\n\n' "${{ steps.versions.outputs.v1_version }}" "$release_date"
                cat "$unreleased_notes"
                printf '\n'
              } >> "$release_blocks"
            fi

            if [[ "${{ steps.changes.outputs.v2 }}" == "true" ]]; then
              {
                printf '## [UltimateSensor V2 %s] - %s\n\n' "${{ steps.versions.outputs.v2_version }}" "$release_date"
                cat "$unreleased_notes"
                printf '\n'
              } >> "$release_blocks"
            fi

            awk -v blocks_file="$release_blocks" '
              BEGIN { in_unreleased=0 }
              $0 == "## [Unreleased]" {
                print
                print ""
                print "- Add customer-facing firmware notes here before merging a PR."
                print ""
                while ((getline line < blocks_file) > 0) {
                  print line
                }
                in_unreleased=1
                next
              }
              in_unreleased && /^## \[/ {
                in_unreleased=0
                print
                next
              }
              in_unreleased { next }
              { print }
            ' CHANGELOG.md > CHANGELOG.md.tmp

            mv CHANGELOG.md.tmp CHANGELOG.md
            rm -f "$unreleased_notes" "$release_blocks"
          }

          create_tag() {
            local tag_name=$1

            if git rev-parse "$tag_name" >/dev/null 2>&1; then
              echo "Tag $tag_name already exists, skipping"
              return
            fi

            echo "Creating tag: $tag_name"
            git tag -a "$tag_name" -m "Release $tag_name"
            git push origin "$tag_name"
          }

          changes_made=false

          if [[ "${{ steps.changes.outputs.v1 }}" == "true" ]]; then
            for version_file in "${version_files_v1[@]}"; do
              sed -i "s/^\s*ultimatesensor_software_version: \".*\"/  ultimatesensor_software_version: \"${{ steps.versions.outputs.v1_version }}\"/" "$version_file"
            done
            changes_made=true
          fi

          if [[ "${{ steps.changes.outputs.v2 }}" == "true" ]]; then
            for version_file in "${version_files_v2[@]}"; do
              sed -i "s/^\s*ultimatesensor_software_version: \".*\"/  ultimatesensor_software_version: \"${{ steps.versions.outputs.v2_version }}\"/" "$version_file"
            done
            changes_made=true
          fi

          if [[ "$changes_made" == "true" ]]; then
            finalize_changelog
          fi

          if [[ "$changes_made" == "true" ]] && ! git diff --quiet; then
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add CHANGELOG.md "${version_files_v1[@]}" "${version_files_v2[@]}"

            msg="chore: update versions"
            [[ "${{ steps.changes.outputs.v1 }}" == "true" ]] && msg="$msg V1=${{ steps.versions.outputs.v1_version }}"
            [[ "${{ steps.changes.outputs.v2 }}" == "true" ]] && msg="$msg V2=${{ steps.versions.outputs.v2_version }}"
            msg="$msg [skip ci]"

            git commit -m "$msg" || exit 0
            git push || echo "Nothing to push"

            if [[ "${{ steps.changes.outputs.v1 }}" == "true" && ! "${{ steps.versions.outputs.v1_version }}" =~ ^dev- ]]; then
              create_tag "ultimatesensor-v1-${{ steps.versions.outputs.v1_version }}"
            fi

            if [[ "${{ steps.changes.outputs.v2 }}" == "true" && ! "${{ steps.versions.outputs.v2_version }}" =~ ^dev- ]]; then
              create_tag "ultimatesensor-v2-${{ steps.versions.outputs.v2_version }}"
            fi
          fi

  build-ultimatesensor-wifi-basic:
    name: Build UltimateSensor WiFi Basic
    needs: [detect-changes]
    if: needs.detect-changes.outputs.v1_build == 'true'
    uses: ./.github/workflows/esphome-build.yml
    with:
      files: ultimatesensor-v1/ultimatesensor-wifi-basic.yaml
      name: UltimateSensor WiFi Basic
      clean: false
      esphome_version: latest
      directory_name: ultimatesensor-wifi-basic
      software_version: ${{ needs.detect-changes.outputs.v1_version }}

  build-ultimatesensor-wifi-complete:
