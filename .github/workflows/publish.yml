          create_manifest "ultimatesensor-v2-ethernet-basic" "ultimatesensor-v2-ethernet-basic-manifest.json" "UltimateSensor V2 Ethernet Basic" "${{ needs.detect-changes.outputs.v2_version }}"
          create_manifest "ultimatesensor-v2-ethernet-complete" "ultimatesensor-v2-ethernet-complete-manifest.json" "UltimateSensor V2 Ethernet Complete" "${{ needs.detect-changes.outputs.v2_version }}"
          create_manifest "ultimatesensor-v2-wifi-basic-cloud" "ultimatesensor-v2-wifi-basic-cloud-manifest.json" "UltimateSensor V2 WiFi Basic Cloud" "${{ needs.detect-changes.outputs.v2_version }}"
          create_manifest "ultimatesensor-v2-wifi-complete-cloud" "ultimatesensor-v2-wifi-complete-cloud-manifest.json" "UltimateSensor V2 WiFi Complete Cloud" "${{ needs.detect-changes.outputs.v2_version }}"
          create_manifest "ultimatesensor-v2-ethernet-basic-cloud" "ultimatesensor-v2-ethernet-basic-cloud-manifest.json" "UltimateSensor V2 Ethernet Basic Cloud" "${{ needs.detect-changes.outputs.v2_version }}"
          create_manifest "ultimatesensor-v2-ethernet-complete-cloud" "ultimatesensor-v2-ethernet-complete-cloud-manifest.json" "UltimateSensor V2 Ethernet Complete Cloud" "${{ needs.detect-changes.outputs.v2_version }}"
          create_manifest "ultimatesensor-v2-wifi-basic-ld2460" "ultimatesensor-v2-wifi-basic-ld2460-manifest.json" "UltimateSensor V2 WiFi Basic LD2460" "${{ needs.detect-changes.outputs.v2_version }}"
          create_manifest "ultimatesensor-v2-wifi-complete-ld2460" "ultimatesensor-v2-wifi-complete-ld2460-manifest.json" "UltimateSensor V2 WiFi Complete LD2460" "${{ needs.detect-changes.outputs.v2_version }}"
          create_manifest "ultimatesensor-v2-ethernet-basic-ld2460" "ultimatesensor-v2-ethernet-basic-ld2460-manifest.json" "UltimateSensor V2 Ethernet Basic LD2460" "${{ needs.detect-changes.outputs.v2_version }}"
          create_manifest "ultimatesensor-v2-ethernet-complete-ld2460" "ultimatesensor-v2-ethernet-complete-ld2460-manifest.json" "UltimateSensor V2 Ethernet Complete LD2460" "${{ needs.detect-changes.outputs.v2_version }}"
          create_manifest "ultimatesensor-v2-wifi-basic-ld2460-cloud" "ultimatesensor-v2-wifi-basic-ld2460-cloud-manifest.json" "UltimateSensor V2 WiFi Basic LD2460 Cloud" "${{ needs.detect-changes.outputs.v2_version }}"
          create_manifest "ultimatesensor-v2-wifi-complete-ld2460-cloud" "ultimatesensor-v2-wifi-complete-ld2460-cloud-manifest.json" "UltimateSensor V2 WiFi Complete LD2460 Cloud" "${{ needs.detect-changes.outputs.v2_version }}"
          create_manifest "ultimatesensor-v2-ethernet-basic-ld2460-cloud" "ultimatesensor-v2-ethernet-basic-ld2460-cloud-manifest.json" "UltimateSensor V2 Ethernet Basic LD2460 Cloud" "${{ needs.detect-changes.outputs.v2_version }}"
          create_manifest "ultimatesensor-v2-ethernet-complete-ld2460-cloud" "ultimatesensor-v2-ethernet-complete-ld2460-cloud-manifest.json" "UltimateSensor V2 Ethernet Complete LD2460 Cloud" "${{ needs.detect-changes.outputs.v2_version }}"

      - name: Create README for gh-pages
        shell: bash
        run: |
          cat > output/README.md <<'README_EOF'
          # UltimateSensor firmware - GitHub Pages branch (gh-pages)

          This branch hosts the public firmware artifacts and manifests for UltimateSensor.
          It is served via GitHub Pages and is intended to be consumed by:
          - ESP Web Tools (browser-based flashing)
          - OTA update integrations (using the JSON manifest)

          ## Do not edit manually
          Files in this branch are generated by the CI workflow in the default branch.
          Any manual changes will be overwritten on the next publish.

          ## Layout
          - `ultimatesensor-wifi-basic/`
          - `ultimatesensor-wifi-complete/`
          - `ultimatesensor-ethernet-basic/`
          - `ultimatesensor-ethernet-complete/`
          - `ultimatesensor-wifi-basic-cloud/`
          - `ultimatesensor-wifi-complete-cloud/`
          - `ultimatesensor-ethernet-basic-cloud/`
          - `ultimatesensor-ethernet-complete-cloud/`
          - `ultimatesensor-v2-wifi-basic/`
          - `ultimatesensor-v2-wifi-complete/`
          - `ultimatesensor-v2-ethernet-basic/`
          - `ultimatesensor-v2-ethernet-complete/`
          - `ultimatesensor-v2-wifi-basic-cloud/`
          - `ultimatesensor-v2-wifi-complete-cloud/`
          - `ultimatesensor-v2-ethernet-basic-cloud/`
          - `ultimatesensor-v2-ethernet-complete-cloud/`
          - `ultimatesensor-v2-wifi-basic-ld2460/`
          - `ultimatesensor-v2-wifi-complete-ld2460/`
          - `ultimatesensor-v2-ethernet-basic-ld2460/`
          - `ultimatesensor-v2-ethernet-complete-ld2460/`
          - `ultimatesensor-v2-wifi-basic-ld2460-cloud/`
          - `ultimatesensor-v2-wifi-complete-ld2460-cloud/`
          - `ultimatesensor-v2-ethernet-basic-ld2460-cloud/`
          - `ultimatesensor-v2-ethernet-complete-ld2460-cloud/`
          - `*-manifest.json` aggregate manifests for OTA and ESP Web Tools

          ## Aggregate manifest URLs
          - `https://smarthomeshop.github.io/ultimatesensor/ultimatesensor-wifi-basic-manifest.json`
          - `https://smarthomeshop.github.io/ultimatesensor/ultimatesensor-wifi-complete-manifest.json`
          - `https://smarthomeshop.github.io/ultimatesensor/ultimatesensor-ethernet-basic-manifest.json`
          - `https://smarthomeshop.github.io/ultimatesensor/ultimatesensor-ethernet-complete-manifest.json`
          - `https://smarthomeshop.github.io/ultimatesensor/ultimatesensor-v2-wifi-basic-manifest.json`
          - `https://smarthomeshop.github.io/ultimatesensor/ultimatesensor-v2-wifi-complete-manifest.json`
          - `https://smarthomeshop.github.io/ultimatesensor/ultimatesensor-v2-ethernet-basic-manifest.json`
          - `https://smarthomeshop.github.io/ultimatesensor/ultimatesensor-v2-ethernet-complete-manifest.json`
          - `https://smarthomeshop.github.io/ultimatesensor/ultimatesensor-v2-wifi-basic-ld2460-manifest.json`
          - `https://smarthomeshop.github.io/ultimatesensor/ultimatesensor-v2-wifi-complete-ld2460-manifest.json`
          - `https://smarthomeshop.github.io/ultimatesensor/ultimatesensor-v2-ethernet-basic-ld2460-manifest.json`
          - `https://smarthomeshop.github.io/ultimatesensor/ultimatesensor-v2-ethernet-complete-ld2460-manifest.json`

          ## How this branch is updated
          On pushes to the default branch, or when manually dispatched, the CI pipeline:
          1. builds all variants with ESPHome
          2. exports firmware and per-variant manifests
          3. writes aggregate manifests
          4. deploys this folder structure to the `gh-pages` branch
          README_EOF

      - name: Debug output structure
        run: find output -maxdepth 2 -type f | sort

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: output
          clean: false
          force: false
          attempt-limit: 6

  create-releases:
    name: Create GitHub releases
    needs: [detect-changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Create releases for changed hardware versions
        shell: bash
        run: |
          set -euo pipefail

          create_release() {
            local tag_name=$1
            local title=$2
            local heading="## [${title}]"

            if gh release view "$tag_name" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $tag_name already exists, skipping"
              return
            fi

            awk -v heading="$heading" '
              index($0, heading) == 1 { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > release-notes.txt

            if [[ ! -s release-notes.txt ]]; then
              awk '
                $0 == "## [Unreleased]" { found=1; next }
                found && /^## \[/ { exit }
                found { print }
              ' CHANGELOG.md > release-notes.txt
            fi

            sed -i '/^- Add customer-facing firmware notes here before merging a PR\.$/d' release-notes.txt
            sed -i '/^- Add customer-facing changes here before the next release is published\.$/d' release-notes.txt

            if [[ ! -s release-notes.txt ]]; then
              printf '%s\n\n%s\n' \
                "Customer-facing firmware notes live in CHANGELOG.md." \
                "Changelog: https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md" \
                > release-notes.txt
            fi

            gh release create "$tag_name" \
              -R "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$title" \
              --notes-file release-notes.txt
          }

          if [[ "${{ needs.detect-changes.outputs.v1_changed }}" == "true" && ! "${{ needs.detect-changes.outputs.v1_version }}" =~ ^dev- ]]; then
            create_release "ultimatesensor-v1-${{ needs.detect-changes.outputs.v1_version }}" "UltimateSensor V1 ${{ needs.detect-changes.outputs.v1_version }}"
          fi

          if [[ "${{ needs.detect-changes.outputs.v2_changed }}" == "true" && ! "${{ needs.detect-changes.outputs.v2_version }}" =~ ^dev- ]]; then
            create_release "ultimatesensor-v2-${{ needs.detect-changes.outputs.v2_version }}" "UltimateSensor V2 ${{ needs.detect-changes.outputs.v2_version }}"
          fi
