      software_version: ${{ needs.detect-changes.outputs.v1_version }}

  build-ultimatesensor-v2-wifi-basic:
    name: Build UltimateSensor V2 WiFi Basic
    needs: [detect-changes]
    if: needs.detect-changes.outputs.v2_build == 'true'
    uses: ./.github/workflows/esphome-build.yml
    with:
      files: ultimatesensor-v2/ultimatesensor-v2-wifi-basic.yaml
      name: UltimateSensor V2 WiFi Basic
      clean: false
      esphome_version: latest
      directory_name: ultimatesensor-v2-wifi-basic
      software_version: ${{ needs.detect-changes.outputs.v2_version }}
