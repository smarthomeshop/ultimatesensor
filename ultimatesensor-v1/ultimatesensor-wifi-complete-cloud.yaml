# UltimateSensor WiFi Complete Cloud Configuration

substitutions:
  device_name: ultimatesensor
  friendly_name: "UltimateSensor"
  ultimatesensor_software_version: "1.10"
  ultimatesensor_hardware_version: "V1-Complete"
  ultimatesensor_connection_type: "WiFi"
  wifi_fast_connect: "false"
  cloud_mac_sensor_id: wifi_mac
  cloud_ip_sensor_id: wifi_ip

packages:
  base: !include base.yaml
  ld2450_zones: !include zones.yaml
  net: !include wifi.yaml
  variant: !include complete.yaml
  cloud: !include cloud.yaml
  zones: !include cloud-zones.yaml
  cloud_pm: !include cloud-pm.yaml

dashboard_import:
  package_import_url: github://smarthomeshop/ultimatesensor/ultimatesensor-v1/ultimatesensor-wifi-complete-cloud.yaml@main
