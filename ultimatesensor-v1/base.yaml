# UltimateSensor Base Configuration
# Core device features shared by all V1 variants.

substitutions:
  # Bumped by the release workflow. Defined here (not per variant) so every V1
  # firmware reports the same version, matching how V2 is set up.
  ultimatesensor_software_version: "2.6"

# Esphome start
esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  min_version: 2025.2.0
  project:
    name: "smarthomeshop.ultimatesensor"
    version: ${ultimatesensor_software_version}

esp32:
  board: esp32dev
  flash_size: 4MB
  framework:
    type: esp-idf

# Enable logging
logger:
  level: INFO
  hardware_uart: UART0

preferences:
  # Persist tracking and other configuration settings promptly after a user
  # changes them, while still batching writes to limit flash wear.
  flash_write_interval: 10s

# Enable Home Assistant API
api:
  actions:
    - action: set_ambient_pressure
      variables:
        pressure_mbar: int
      then:
        - lambda: "id(scd41)->set_ambient_pressure_compensation(pressure_mbar);"

#Enable Over the Air updates
ota:
  - platform: esphome

#Enable web server so you can view data in browser if you go to ip of the device
web_server:
  port: 80
  version: 3

# Enable I2C
i2c:
  sda: GPIO05
  scl: GPIO04
  scan: true
  id: bus_a

light:
  # WS2812B LED at the back
  - platform: esp32_rmt_led_strip
    id: rgb_back_led
    pin: GPIO13
    num_leds: 1
    rgb_order: GRB
    chipset: ws2812
    name: "Back Light"

# Status LED of ESP
status_led:
  pin: GPIO14

font:
  - file: "gfonts://Roboto"
    id: font1
    size: 40
  - file: "gfonts://Roboto"
    id: font2
    size: 10
  - file: "gfonts://Roboto"
    id: font3
    size: 15

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    id: oled_display
    contrast: 40%
    lambda: |-
      // Display the CO2 measurement
      if (id(scd41_co2).has_state()) {
        it.printf(0, 10, id(font1), "%.0f", id(scd41_co2).state);
      }
      it.print(0, 0, id(font2), "CO2");

      // Display the Temperature
      if (id(scd41_temperature).has_state()) {
        it.printf(100, 0, id(font3), "%.0f°C", id(scd41_temperature).state);
      }

      // Display the Humidity
      if (id(scd41_humidity).has_state()) {
        it.printf(100, 20, id(font3), "%.0f%%", id(scd41_humidity).state);
      }
      // Display the LUX
      if (id(illuminance).has_state()) {
        it.printf(100, 40, id(font3), "%.0flx%", id(illuminance).state);
      }
      // Display PIR status
      if (id(pir_sensor).state) {
        //it.draw_bitmap(0, 30, 16, 16, id(stick_figure_bitmap));
        it.printf(30, 0, id(font2), "PIR");

      }


sensor:
  # ESP32 internal diagnostic temperature
  - platform: internal_temperature
    id: cpu_temperature
    name: "CPU Temperature"
    entity_category: diagnostic
    update_interval: 60s

  # SCD41
  - platform: scd4x
    id: scd41
    co2:
      name: "SCD41 CO2"
      id: scd41_co2
    temperature:
      name: "SCD41 Temperature"
      id: scd41_temperature
    humidity:
      name: "SCD41 Humidity"
      id: scd41_humidity
    measurement_mode: low_power_periodic
    update_interval: 30s

  # BH1750
  - platform: bh1750
    name: "BH1750 Illuminance"
    id: illuminance
    address: 0x23
    update_interval: 60s

  # SGP40
  - platform: sgp4x
    voc:
      id: voc_index
      name: "VOC Index"
    nox:
      id: nox_index
      name: "NOx Index"


binary_sensor:
  #PIR sensor
  - platform: gpio
    pin: GPIO34
    name: "PIR Sensor"
    device_class: motion
    id: pir_sensor
    filters:
      - delayed_off:
          seconds: 1

  # Stable product occupancy entity; LD2450 itself is provided by the shared
  # tracking package included by every UltimateSensor V1 firmware variant.
  - platform: template
    id: occupancy
    name: "Occupancy"
    device_class: occupancy
    lambda: return id(tracking_presence).state;



#Restart and calibration buttons
button:
  - platform: restart
    name: "Restart UltimateSensor"
  - platform: template
    name: "CO2 manual calibration"
    entity_category: "config"
    on_press:
      then:
        - scd4x.perform_forced_calibration:
            value: 419
            id: scd41
switch:
  - platform: template
    name: "LCD Display"
    id: lcd_display_switch
    icon: "mdi:monitor"
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    turn_on_action:
      - lambda: |-
          id(oled_display).turn_on();
    turn_off_action:
      - lambda: |-
          id(oled_display).turn_off();
text_sensor:
  # ESPHome information
  - platform: version
    id: text_sensor_version
    name: "ESPHome Version"
  # UltimateSensor Information
  - platform: template
    id: text_sensor_ultimatesensor_software_version
    name: "Software Version"
    update_interval: 5h
    lambda: |-
      return {"${ultimatesensor_software_version}"};
  - platform: template
    id: text_sensor_ultimatesensor_hardware_version
    name: "Hardware Version"
    update_interval: 5h
    lambda: |-
      return {"${ultimatesensor_hardware_version}"};
  - platform: template
    id: text_sensor_ultimatesensor_connection_type
    name: "Connection type"
    update_interval: 5h
    lambda: |-
      return {"${ultimatesensor_connection_type}"};
