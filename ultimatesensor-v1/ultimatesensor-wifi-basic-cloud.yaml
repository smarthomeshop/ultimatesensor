# UltimateSensor WiFi Basic Cloud Configuration

substitutions:
  device_name: ultimatesensor
  friendly_name: "UltimateSensor"
  ultimatesensor_software_version: "1.8"
  ultimatesensor_hardware_version: "V1-Basic"
  ultimatesensor_connection_type: "WiFi"
  wifi_fast_connect: "true"
  cloud_mac_sensor_id: wifi_mac
  cloud_ip_sensor_id: wifi_ip

packages:
  base: !include base.yaml
  net: !include wifi.yaml
  cloud: !include cloud.yaml
  zones: !include cloud-zones.yaml

dashboard_import:
  package_import_url: github://smarthomeshop/ultimatesensor/ultimatesensor-v1/ultimatesensor-wifi-basic-cloud.yaml@main
