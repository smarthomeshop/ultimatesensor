# UltimateSensor WiFi Basic Configuration
# This configuration excludes the Particulate Matter (PM) sensor.
# Use this file if your device does not include the PM/fine dust sensor.

substitutions:
  device_name: ultimatesensor
  friendly_name: "UltimateSensor"
  ultimatesensor_software_version: "1.7"
  ultimatesensor_hardware_version: "V1-Basic"
  ultimatesensor_connection_type: "WiFi"
  wifi_fast_connect: "true"

packages:
  base: !include base.yaml
  net: !include wifi.yaml

dashboard_import:
  package_import_url: github://smarthomeshop/ultimatesensor/ultimatesensor-v1/ultimatesensor-wifi-basic.yaml@main
