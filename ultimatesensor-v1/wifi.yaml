# WiFi configuration for UltimateSensor variants
wifi:
  # Production firmware must not contain compile-time WiFi credentials.
  # Web-flashed devices start their fallback AP and are configured by the portal/improv.
  fast_connect: ${wifi_fast_connect}
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: ${device_name}
    password: ${device_name}

captive_portal:

# Improv BLE + Serial (for provisioning)
esp32_improv:
  authorizer: none
improv_serial:

text_sensor:
  # WiFi info
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: wifi_ip
      icon: "mdi:network-outline"
      entity_category: diagnostic
      disabled_by_default: true
    mac_address:
      name: "ESP MAC"
      id: wifi_mac
      entity_category: diagnostic
      disabled_by_default: true
    ssid:
      name: "Connected SSID"
      entity_category: diagnostic
    bssid:
      name: "Connected BSSID"
      entity_category: diagnostic
      disabled_by_default: true
