# UltimateSensor V1 LD2450 tracking and polygon zones.
# Keeps the V1 target entity names stable while using ESPHome's native LD2450
# component plus the SmartHomeShop polygon zone API used by the HA integration.

packages:
  ld2450_polygon_zones: github://smarthomeshop/ld2450/packages/ld2450-polygon-zones.yaml@main

uart:
  id: uart_ld2450
  tx_pin: GPIO15
  rx_pin:
    number: GPIO02
    mode:
      input: true
      pullup: true
  baud_rate: 256000
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 1024

ld2450:
  id: ld2450_radar
  uart_id: uart_ld2450

binary_sensor:
  - platform: ld2450
    ld2450_id: ld2450_radar
    has_target:
      id: occupancy
      name: "Occupancy"
      device_class: occupancy
      filters:
        - delayed_off: !lambda return (id(off_delay).state * 1000);
    has_moving_target:
      name: "Moving Target"
      device_class: motion
      filters:
        - delayed_off: 1s
    has_still_target:
      name: "Still Target"
      device_class: occupancy
      filters:
        - delayed_off: 1s

  - platform: template
    name: "Zone 1 Occupancy"
    id: zone1_occupancy
    device_class: occupancy
    lambda: |-
      return id(zone1_target_count).state > 0;
    filters:
      - delayed_off: !lambda return (id(zone_1_off_delay).state * 1000);
  - platform: template
    name: "Zone 2 Occupancy"
    id: zone2_occupancy
    device_class: occupancy
    lambda: |-
      return id(zone2_target_count).state > 0;
    filters:
      - delayed_off: !lambda return (id(zone_2_off_delay).state * 1000);
  - platform: template
    name: "Zone 3 Occupancy"
    id: zone3_occupancy
    device_class: occupancy
    lambda: |-
      return id(zone3_target_count).state > 0;
    filters:
      - delayed_off: !lambda return (id(zone_3_off_delay).state * 1000);

  - platform: template
    name: "Target 1 Active"
    id: target1_active
    lambda: |-
      return id(radar_target1_distance).state > 0;
  - platform: template
    name: "Target 2 Active"
    id: target2_active
    lambda: |-
      return id(radar_target2_distance).state > 0;
  - platform: template
    name: "Target 3 Active"
    id: target3_active
    lambda: |-
      return id(radar_target3_distance).state > 0;

sensor:
  - platform: ld2450
    ld2450_id: ld2450_radar
    target_count:
      name: "Radar Target Count"
      filters:
        - throttle: 1s
    still_target_count:
      name: "Radar Still Target Count"
      filters:
        - throttle: 1s
    moving_target_count:
      name: "Radar Moving Target Count"
      filters:
        - throttle: 1s
    target_1:
      x:
        id: radar_target1_x
        name: "Target 1 X"
        filters:
          - throttle: 250ms
      y:
        id: radar_target1_y
        name: "Target 1 Y"
        filters:
          - throttle: 250ms
      speed:
        id: radar_target1_speed
        name: "Target 1 Speed"
        filters:
          - throttle: 250ms
      angle:
        id: radar_target1_angle
        name: "Target 1 Angle"
        filters:
          - throttle: 250ms
      distance:
        id: radar_target1_distance
        name: "Target 1 Distance"
        filters:
          - throttle: 250ms
      resolution:
        id: radar_target1_resolution
        name: "Target 1 Resolution"
        filters:
          - throttle: 250ms
    target_2:
      x:
        id: radar_target2_x
        name: "Target 2 X"
        filters:
          - throttle: 250ms
      y:
        id: radar_target2_y
        name: "Target 2 Y"
        filters:
          - throttle: 250ms
      speed:
        id: radar_target2_speed
        name: "Target 2 Speed"
        filters:
          - throttle: 250ms
      angle:
        id: radar_target2_angle
        name: "Target 2 Angle"
        filters:
          - throttle: 250ms
      distance:
        id: radar_target2_distance
        name: "Target 2 Distance"
        filters:
          - throttle: 250ms
      resolution:
        id: radar_target2_resolution
        name: "Target 2 Resolution"
        filters:
          - throttle: 250ms
    target_3:
      x:
        id: radar_target3_x
        name: "Target 3 X"
        filters:
          - throttle: 250ms
      y:
        id: radar_target3_y
        name: "Target 3 Y"
        filters:
          - throttle: 250ms
      speed:
        id: radar_target3_speed
        name: "Target 3 Speed"
        filters:
          - throttle: 250ms
      angle:
        id: radar_target3_angle
        name: "Target 3 Angle"
        filters:
          - throttle: 250ms
      distance:
        id: radar_target3_distance
        name: "Target 3 Distance"
        filters:
          - throttle: 250ms
      resolution:
        id: radar_target3_resolution
        name: "Target 3 Resolution"
        filters:
          - throttle: 250ms
    zone_1:
      target_count:
        id: zone1_target_count
        name: "Zone 1 Target Count"
        filters:
          - throttle: 1s
      still_target_count:
        id: zone1_still_target_count
        name: "Zone 1 Still Target Count"
        filters:
          - throttle: 1s
      moving_target_count:
        id: zone1_moving_target_count
        name: "Zone 1 Moving Target Count"
        filters:
          - throttle: 1s
    zone_2:
      target_count:
        id: zone2_target_count
        name: "Zone 2 Target Count"
        filters:
          - throttle: 1s
      still_target_count:
        id: zone2_still_target_count
        name: "Zone 2 Still Target Count"
        filters:
          - throttle: 1s
      moving_target_count:
        id: zone2_moving_target_count
        name: "Zone 2 Moving Target Count"
        filters:
          - throttle: 1s
    zone_3:
      target_count:
        id: zone3_target_count
        name: "Zone 3 Target Count"
        filters:
          - throttle: 1s
      still_target_count:
        id: zone3_still_target_count
        name: "Zone 3 Still Target Count"
        filters:
          - throttle: 1s
      moving_target_count:
        id: zone3_moving_target_count
        name: "Zone 3 Moving Target Count"
        filters:
          - throttle: 1s

number:
  - platform: ld2450
    ld2450_id: ld2450_radar
    presence_timeout:
      id: ld2450_presence_timeout
      internal: true
    zone_1:
      x1:
        name: "Zone 1 X1"
      y1:
        name: "Zone 1 Y1"
      x2:
        name: "Zone 1 X2"
      y2:
        name: "Zone 1 Y2"
    zone_2:
      x1:
        name: "Zone 2 X1"
      y1:
        name: "Zone 2 Y1"
      x2:
        name: "Zone 2 X2"
      y2:
        name: "Zone 2 Y2"
    zone_3:
      x1:
        name: "Zone 3 X1"
      y1:
        name: "Zone 3 Y1"
      x2:
        name: "Zone 3 X2"
      y2:
        name: "Zone 3 Y2"

  - platform: template
    name: "Presence Timeout"
    id: user_presence_timeout
    unit_of_measurement: "s"
    min_value: 1
    max_value: 600
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 60
    set_action:
      then:
        - number.set:
            id: ld2450_presence_timeout
            value: !lambda 'return x;'

  - platform: template
    name: "Occupancy Off Delay"
    id: off_delay
    max_value: 600
    min_value: 0
    step: 1
    optimistic: true
    restore_value: true
    unit_of_measurement: "s"
    initial_value: 15
  - platform: template
    name: "Zone 1 Occupancy Off Delay"
    id: zone_1_off_delay
    max_value: 600
    min_value: 0
    step: 1
    optimistic: true
    restore_value: true
    unit_of_measurement: "s"
    initial_value: 15
  - platform: template
    name: "Zone 2 Occupancy Off Delay"
    id: zone_2_off_delay
    max_value: 600
    min_value: 0
    step: 1
    optimistic: true
    restore_value: true
    unit_of_measurement: "s"
    initial_value: 15
  - platform: template
    name: "Zone 3 Occupancy Off Delay"
    id: zone_3_off_delay
    max_value: 600
    min_value: 0
    step: 1
    optimistic: true
    restore_value: true
    unit_of_measurement: "s"
    initial_value: 15

switch:
  - platform: ld2450
    ld2450_id: ld2450_radar
    bluetooth:
      name: "LD2450 Bluetooth"
      id: ld2450_bluetooth
      entity_category: config
    multi_target:
      name: "LD2450 Multi Target"
      id: ld2450_multi_target
      entity_category: config

button:
  - platform: ld2450
    ld2450_id: ld2450_radar
    factory_reset:
      name: "LD2450 Factory Reset"
      id: ld2450_factory_reset
      entity_category: diagnostic
      icon: mdi:backup-restore
      disabled_by_default: true
    restart:
      name: "LD2450 Restart"
      id: ld2450_restart
      entity_category: diagnostic
      icon: mdi:restart

text_sensor:
  - platform: ld2450
    ld2450_id: ld2450_radar
    version:
      name: "LD2450 Firmware"
      entity_category: diagnostic
    mac_address:
      name: "LD2450 Bluetooth MAC"
      entity_category: diagnostic
