# UltimateSensor Ethernet Complete Configuration
# This configuration includes settings for all sensors, including the Particulate Matter (PM) sensor.
# Use this file if your device includes the PM/fine dust measurement capability and uses Ethernet.

substitutions:
  device_name: ultimatesensor
  friendly_name: "UltimateSensor"
  ultimatesensor_hardware_version: "V1-Complete"
  ultimatesensor_connection_type: "Ethernet"
  default_network: "Ethernet Complete (local)"
  update_manifest_url: "https://smarthomeshop.github.io/ultimatesensor/ultimatesensor-ethernet-complete-manifest.json"

packages:
  base: !include base.yaml
  ld2450_zones: !include zones.yaml
  net: !include ethernet.yaml
  variant: !include complete.yaml
  firmware: !include firmware-selector.yaml

dashboard_import:
  package_import_url: github://smarthomeshop/ultimatesensor/ultimatesensor-v1/ultimatesensor-ethernet-complete.yaml@main
